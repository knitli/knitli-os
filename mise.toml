[settings]
experimental = true

[tools]
node = "24"
pnpm = "latest"
"npm:@codacy/codacy-cloud-cli" = "latest"
viteplus = "latest"
python = "3.13"

[deps]

[deps.pnpm]
auto = true
run = "pnpm install -y"
sources = [
  "pnpm-lock.yaml",
  "packages/*/pnpm-lock.yaml",
  "package.json",
  "packages/*/package.json",
  "pnpm-workspace.yaml",
]
